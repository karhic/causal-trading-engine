[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causaltrader"
version = "0.1.0"
description = "A small causal research -> paper -> live trading engine with point-in-time data guarantees."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Karl Hickey"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
ibkr-smoke = "causaltrader.ibkr_smoke:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
